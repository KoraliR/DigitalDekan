# Host-nginx для «Цифрового деканата» — альтернатива Caddy.
#
# В этом варианте docker-compose.caddy.yml НЕ используется: запускается только
# docker-compose.prod.yml, а app слушает 127.0.0.1:3000 на хосте.
# TLS-сертификат выпускает certbot (см. README.md в этом каталоге).
#
# Установка:
#   sudo cp dekanat.conf /etc/nginx/sites-available/dekanat.conf
#   sudo sed -i 's/dekanat.example.ru/ваш.домен.ru/g' /etc/nginx/sites-available/dekanat.conf
#   sudo ln -s /etc/nginx/sites-available/dekanat.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Везде ниже dekanat.example.ru — плейсхолдер; замените его на реальный домен
# (тот же, что DOMAIN в deploy/.env.prod, без https:// и без слэшей).

# ---------------------------------------------------------------------------
# HTTP -> HTTPS. ACME-челлендж certbot оставляем доступным по HTTP.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dekanat.example.ru;

    # Точка для HTTP-01 челленджа (используется при certbot --webroot;
    # режиму certbot --nginx она не мешает).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: проксирование в Docker-приложение на loopback-порту 3000.
# ---------------------------------------------------------------------------
server {
    # http2 через директиву listen: подходит для nginx 1.18/1.24 из Ubuntu 22.04/24.04.
    # Для nginx >= 1.25.1 используйте: listen 443 ssl; + отдельную строку "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dekanat.example.ru;

    # Не показывать версию nginx в заголовке Server.
    server_tokens off;

    # Сертификаты Let's Encrypt. Эти строки обычно добавляет сам `certbot --nginx`;
    # раскомментируйте, если выпускаете сертификат вручную.
    # ssl_certificate     /etc/letsencrypt/live/dekanat.example.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dekanat.example.ru/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;

    # Лимит тела запроса (загрузка документов в кабинет).
    client_max_body_size 10m;

    # Сжатие текстовых ответов (Next.js отдаёт их без предварительного gzip).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    # Заголовки безопасности. Часть из них отдаёт и само приложение (next.config.ts):
    # дубли одинаковых значений безопасны; при желании скройте их:
    #   proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3000;

        # От этих заголовков зависят secure-cookie Auth.js и адреса QR-кодов.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
