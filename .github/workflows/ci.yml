name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
        env:
          DEMO_2FA_ENABLED: "false"
          AUTH_SECRET: ci-secret-for-build-only
          DATABASE_URL: postgresql://user:password@localhost:5432/dekanat?schema=public
